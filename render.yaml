services:
  - type: web
    name: hqms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql+asyncpg://neondb_owner:npg_EDIJlB68iFOy@ep-floral-wildflower-axxa793r-pooler.c-4.us-east-2.aws.neon.tech/neondb?ssl=require"
      - key: NOTIFICATION_PROVIDER
        value: "fast2sms"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAILS_FROM_EMAIL
        value: "onboarding@resend.dev"
      - key: EMAILS_FROM_NAME
        value: "HQMS Clinical Network"
      - key: BACKEND_CORS_ORIGINS
        value: "https://*,http://localhost:3000"
