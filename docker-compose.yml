version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hqms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hqms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hqms_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-hqms_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hqms_admin} -d ${POSTGRES_DB:-hqms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hqms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hqms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hqms_admin}:${POSTGRES_PASSWORD:-hqms_secure_password}@postgres:5432/${POSTGRES_DB:-hqms_db}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
